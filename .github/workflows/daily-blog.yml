name: Daily Dev Blog
run-name: "Daily Dev Blog | date=${{ inputs.date_override || 'auto' }} | dry_run=${{ inputs.dry_run && 'true' || 'false' }}"

# Sweeps GitHub activity, calls Claude, commits the article to a branch
# article/YYYY-MM-DD, and opens a PR for editorial review. The PR stays
# open until accepted via the editorial UI or merged manually.
# Deploy lives in deploy-vercel.yml; fires on push to main (PR merge).
#
# Required secrets:
#   ANTHROPIC_API_KEY   — Claude API key
#   GH_PAT              — PAT with read access to all ojfbot repos (private + public)

on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 America/Chicago daily
      timezone: 'America/Chicago'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Generate for this date (YYYY-MM-DD). Defaults to today America/Chicago.'
        required: false
        type: string
      dry_run:
        description: 'Print article to logs without writing, committing, or opening a PR.'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    name: Generate & open PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      date: ${{ steps.commit.outputs.date }}
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve date and duplicate state
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE_OVERRIDE: ${{ inputs.date_override }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python3 .github/scripts/daily_blog_schedule.py preflight

      - name: Recover existing article branch
        if: steps.preflight.outputs.mode == 'recover'
        env:
          ARTICLE_DATE: ${{ steps.preflight.outputs.date }}
        run: |
          git fetch origin "refs/heads/article/${ARTICLE_DATE}"
          git checkout -B "article/${ARTICLE_DATE}" FETCH_HEAD

      - name: Setup pnpm
        if: steps.preflight.outputs.mode == 'generate'
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Setup Node.js
        if: steps.preflight.outputs.mode == 'generate'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.preflight.outputs.mode == 'generate'
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        if: steps.preflight.outputs.mode == 'generate'
        run: pnpm test

      # Fail fast on a dead GH_PAT (the cleaner has this check; the blog did
      # not — an expired PAT produced empty sweeps and green no-op runs for
      # three weeks, 2026-05-19 → 2026-06-09).
      - name: Smoke test sweep auth
        if: steps.preflight.outputs.mode == 'generate'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Checking gh auth status..."
          gh auth status
          echo "✓ GH_PAT is valid — safe to proceed with the sweep"

      - name: Fetch telemetry snapshot
        if: steps.preflight.outputs.mode == 'generate'
        continue-on-error: true
        run: |
          git clone --depth 1 --branch telemetry/daily \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/ojfbot/core.git \
            /tmp/telemetry-snapshot 2>/dev/null || echo "No telemetry snapshot available"

      - name: Generate article
        if: steps.preflight.outputs.mode == 'generate'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GH_PAT has read access to all private ojfbot repos for the sweep.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OJFBOT_ORG: ojfbot
          DATE_OVERRIDE: ${{ steps.preflight.outputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TELEMETRY_DIR: /tmp/telemetry-snapshot
        run: pnpm generate

      - name: Build static JSON API
        if: steps.preflight.outputs.mode == 'generate' && github.event.inputs.dry_run != 'true'
        run: pnpm build:api

      - name: Upload article artifact
        if: always() && steps.preflight.outputs.mode == 'generate'
        uses: actions/upload-artifact@v4
        with:
          name: article-${{ github.run_number }}
          path: _articles/
          retention-days: 90
          if-no-files-found: ignore

      # ── Branch + commit ─────────────────────────────────────────────────────
      # Creates branch article/YYYY-MM-DD, commits the article, pushes.
      # Emits step outputs `date` and `branch` consumed by the PR step.
      # Exits cleanly (empty outputs) if: dry_run, branch exists, or no changes.

      - name: Create branch and commit article
        if: steps.preflight.outputs.mode != 'complete' && github.event.inputs.dry_run != 'true'
        id: commit
        env:
          ARTICLE_DATE: ${{ steps.preflight.outputs.date }}
          ARTICLE_MODE: ${{ steps.preflight.outputs.mode }}
        run: |
          DATE="$ARTICLE_DATE"
          BRANCH="article/${DATE}"

          if [ "$ARTICLE_MODE" = 'recover' ]; then
            echo "date=${DATE}" >> "$GITHUB_OUTPUT"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A meaningful-activity skip creates no article, even if API rebuilding changed files.
          if [ ! -f "_articles/${DATE}.md" ]; then
            echo "::notice::No article generated for ${DATE}."
            exit 0
          fi

          git config user.name "ojfbot-blog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin "${BRANCH}" > /dev/null 2>&1; then
            echo "::notice::Branch ${BRANCH} already exists — skipping."
            exit 0
          fi

          git checkout -b "${BRANCH}"
          git add _articles/ api/

          if git diff --staged --quiet; then
            echo "::notice::No article changes staged."
            exit 0
          fi

          git commit -m "blog: ${DATE} [skip ci]"
          git push -u origin "${BRANCH}"

          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      # ── Open PR for editorial review ────────────────────────────────────────
      # Opens a ready-for-review PR using the article frontmatter.
      # PR body is built by .github/scripts/build_pr_body.py (avoids YAML/heredoc issues).
      # Uses GH_PAT — GITHUB_TOKEN cannot create PRs without org-level settings.
      # Only runs when the commit step actually pushed a new branch.
      # The PR stays open for editorial review — merge manually or via the
      # editorial UI's "Accept Draft" / "Accept with Revisions" flow.

      - name: Open PR for editorial review
        if: steps.commit.outputs.date != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          DATE="${{ steps.commit.outputs.date }}"
          BRANCH="${{ steps.commit.outputs.branch }}"

          python3 .github/scripts/build_pr_body.py \
            "${DATE}" "${BRANCH}" "_articles/${DATE}.md" \
            > /tmp/pr-body.md

          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "::notice::PR #${EXISTING} already exists."
            exit 0
          fi

          gh pr create \
            --title "blog: ${DATE}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "${BRANCH}"

      # The dependent cleaner checks this successful step on the source run.
      - name: Article ready for cleaner
        if: steps.commit.outputs.date != ''
        run: echo 'Article and editorial PR are ready.'

  # ── Auto-merge ──────────────────────────────────────────────────────────────
  # Enables auto-merge on the article PR so the draft is visible on
  # log.jim.software when JFO wakes up, without manual PR merge.
  # Uses --auto --rebase: GitHub merges once all required checks pass.
  # If CI fails, the PR stays open for manual review.
  # See ADR-0038 for rationale and safety analysis.

  auto-merge:
    name: Auto-merge draft article
    needs: generate
    if: needs.generate.outputs.date != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          DATE="${{ needs.generate.outputs.date }}"
          BRANCH="article/${DATE}"

          # Find the PR for this branch
          PR=$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number')

          if [[ -z "$PR" ]]; then
            echo "::warning::No PR found for branch ${BRANCH}"
            exit 0
          fi

          echo "Enabling auto-merge for PR #${PR}..."
          gh pr merge "${PR}" --auto --rebase
          echo "Auto-merge enabled. PR will merge when all checks pass."

  # ── Failure alert (roadmap A2) ──────────────────────────────────────────────
  # On any job failure: open (or update) a single `pipeline-alert` issue
  # assigned to the owner. Assignment makes the GitHub mobile app push it.
  # Replying /disable on the issue turns the cron off — see
  # pipeline-alert-commands.yml. Email proved ignorable across two outages;
  # this is the surface that isn't.

  alert-on-failure:
    name: Alert on failure
    needs: [generate, auto-merge]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Open or update pipeline-alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_FILE: daily-blog.yml
          OWNER: ojfbot
        run: |
          TITLE="🔴 ${WORKFLOW_FILE} is failing"
          EXISTING=$(gh issue list -R "$REPO" --label pipeline-alert --state open \
            --search "in:title ${WORKFLOW_FILE}" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$REPO" --body "Failed again: ${RUN_URL}"
          else
            gh issue create -R "$REPO" \
              --title "$TITLE" \
              --label pipeline-alert \
              --assignee "$OWNER" \
              --body "$(printf 'workflow-file: %s\n\nLatest failed run: %s\n\n@%s reply here:\n- `/disable` — stop the cron until further notice\n- `/enable` — turn it back on\n\n_Opened automatically; one issue per workflow, updated on repeat failures._' "$WORKFLOW_FILE" "$RUN_URL" "$OWNER")"
          fi

name: Daily Cleaner

# Runs after Daily Dev Blog completes successfully to check for stale documentation and
# resolved TODO/FIXME comments across all active ojfbot repos.
#
# Phase 1: Sweep   — find candidates in changed files + doc files
# Phase 2: Validate — Claude Opus validates each one (slow, rigorous)
# Phase 3: PR      — one PR per affected repo with specific line edits
#
# Required secrets:
#   ANTHROPIC_API_KEY  — Claude API key (Opus calls)
#   GH_PAT             — PAT with read+write access to all ojfbot repos

on:
  # Requires the completed Daily Dev Blog run to provide the day's context.
  workflow_run:
    workflows: ['Daily Dev Blog']
    types: [completed]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print proposals without opening PRs.'
        required: false
        type: boolean
        default: true
      target_repo:
        description: 'Sweep only this repo slug (e.g. "shell"). Default: all active.'
        required: false
        type: string
      date_override:
        description: 'Override date for context sweep (YYYY-MM-DD). Default: today.'
        required: false
        type: string

concurrency:
  group: daily-cleaner
  cancel-in-progress: false

jobs:
  admission:
    name: Check source article completion
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      proceed: ${{ steps.source.outputs.proceed }}
      date: ${{ steps.source.outputs.date }}
    # Failed blog runs do not admit a cleaner run.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
      - name: Check source run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          DATE_OVERRIDE: ${{ inputs.date_override }}
        run: python3 .github/scripts/daily_blog_schedule.py cleaner

  clean:
    needs: admission
    if: needs.admission.outputs.proceed == 'true'
    name: Sweep, validate, and PR stale content
    runs-on: ubuntu-latest
    timeout-minutes: 60    # Opus validation can take 30-45 min for a full sweep

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity and credential helper
        env:
          # GH_TOKEN needed here so gh auth setup-git can install the credential
          # helper against an authenticated session. Without this, git push from
          # cloned /tmp repos fails with "No such device or address" because git
          # tries to open /dev/tty to prompt for credentials (no TTY in CI).
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "ojfbot-clean[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Install gh as a global git credential helper so all git push calls
          # (including from /tmp clones in the cleaner script) use GH_TOKEN.
          gh auth setup-git

      # Prove push access BEFORE the expensive 30-45 min Opus phase so we
      # fail fast and loudly rather than after all the API spend.
      # A dry-run push needs write access and sends nothing (`git ls-remote`,
      # used before #604, only proved read access).
      # Gap: this proves write to one repo (TARGET_REPO, else daily-logger),
      # not to every repo the cleaner may open a PR on. A push that fails later
      # is now counted, named in the log, and turns the run red.
      # DRY_RUN skips this (no push will happen anyway).
      - name: Check GH_PAT can push (dry run)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_REPO: ${{ github.event.inputs.target_repo || '' }}
        run: |
          echo "Checking gh auth status..."
          gh auth status
          echo ""
          REPO_SLUG="${TARGET_REPO:-daily-logger}"
          echo "Checking push access to ojfbot/${REPO_SLUG}..."
          bash .github/scripts/check-push-access.sh "https://github.com/ojfbot/${REPO_SLUG}.git"

      - name: Run daily cleaner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GH_PAT needs read+write access to all ojfbot repos for cloning + PR creation
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OJFBOT_ORG: ojfbot
          DATE_OVERRIDE: ${{ needs.admission.outputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TARGET_REPO: ${{ github.event.inputs.target_repo || '' }}
        run: pnpm clean

  # ── Failure alert (roadmap A2) ──────────────────────────────────────────────
  # Same loop as daily-blog.yml: assigned `pipeline-alert` issue → GitHub
  # mobile push → /disable to stop the cron. A separate job, not a step in
  # `clean`: a job that hits timeout-minutes ends "cancelled" and its own
  # later steps may never run, so the alert must not live inside it (#604).

  alert-on-failure:
    name: Alert on failure
    needs: [admission, clean]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Open or update pipeline-alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_FILE: daily-cleaner.yml
          OWNER: ojfbot
        run: |
          TITLE="🔴 ${WORKFLOW_FILE} is failing"
          EXISTING=$(gh issue list -R "$REPO" --label pipeline-alert --state open \
            --search "in:title ${WORKFLOW_FILE}" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$REPO" --body "Failed or cancelled again (a timeout ends as cancelled): ${RUN_URL}"
          else
            gh issue create -R "$REPO" \
              --title "$TITLE" \
              --label pipeline-alert \
              --assignee "$OWNER" \
              --body "$(printf 'workflow-file: %s\n\nLatest failed or cancelled run: %s\n\n@%s reply here:\n- `/disable` — stop the cron until further notice\n- `/enable` — turn it back on\n\n_Opened automatically; one issue per workflow, updated on repeat failures._' "$WORKFLOW_FILE" "$RUN_URL" "$OWNER")"
          fi

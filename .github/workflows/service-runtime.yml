name: Private fixture runtime image proof

on:
  pull_request:
    paths:
      - apps/service/**
      - packages/journal/**
      - docs/agent-service/editorial-api-responses.schema.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/frontend/package.json
      - .github/workflows/service-runtime.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check:service
      - run: pnpm type-check:journal
      - run: pnpm test:service:runtime
      - run: pnpm test:service:artifact
      - name: Prepare credential-free committed build context
        run: pnpm service:runtime:context "$RUNNER_TEMP/dailylogger-runtime-context"
      - name: Build without publishing
        run: docker build -t dailylogger-runtime:proof "$RUNNER_TEMP/dailylogger-runtime-context"
      - name: Export, reload and qualify disposable fixture image
        env:
          GH_TOKEN: ${{ github.token }}
          DAILYLOGGER_ARTIFACT_CREDENTIAL_CANARY: fixture-credential-canary-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          pnpm service:artifact:export --image dailylogger-runtime:proof
          --context "$RUNNER_TEMP/dailylogger-runtime-context"
          --output "$RUNNER_TEMP/dailylogger-fixture-artifact"
      - name: Read qualified image identities
        id: qualified-image
        run: |
          python3 - "$RUNNER_TEMP/dailylogger-fixture-artifact/manifest.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          with open(sys.argv[1]) as source:
              identity = json.load(source)["image"]
          values = {"engine_id": identity["engineId"], "config_id": identity["configId"]}
          assert all(re.fullmatch(r"sha256:[0-9a-f]{64}", value) for value in values.values())
          for key, value in values.items():
              print(f"{key}={value}")
          PY
      - name: Prove enabled exporter lifecycle in the exact final image
        env:
          DAILYLOGGER_QUALIFIED_IMAGE: ${{ steps.qualified-image.outputs.engine_id }}
          DAILYLOGGER_QUALIFIED_CONFIG_ID: ${{ steps.qualified-image.outputs.config_id }}
        run: pnpm service:runtime:exporter "$DAILYLOGGER_QUALIFIED_IMAGE" "$DAILYLOGGER_QUALIFIED_CONFIG_ID"
      - name: Prove isolated matched database and fixture-file restoration
        env:
          DAILYLOGGER_RESTORE_IMAGE: ${{ steps.qualified-image.outputs.engine_id }}
          DAILYLOGGER_RESTORE_CONFIG_ID: ${{ steps.qualified-image.outputs.config_id }}
        run: pnpm test:service:restore
      - name: Retain fixture candidate without publishing or deploying
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dailylogger-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dailylogger-fixture-artifact/manifest.json
            ${{ runner.temp }}/dailylogger-fixture-artifact/runtime-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

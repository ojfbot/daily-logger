name: Editorial Revision
run-name: "Editorial continuation comment ${{ github.event.comment.id || 'automatic' }}"

# Triggered when an editorial accept PR is opened or its body is edited.
# Extracts feedback from the PR body, calls Claude to revise the article,
# and pushes the result back to the PR branch. The final push uses GH_PAT so
# updated-head PR checks run without GITHUB_TOKEN workflow-run approval.
# pull_request_target loads this policy from the trusted base, excludes foreign
# repositories, and admits only a regular dated article and canonical registry before checking out head.
# Other head files must equal the trusted common ancestor. Scripts and dependencies run from the pinned base policy.

on:
  pull_request_target:
    types: [opened, edited]
    branches: [main]
  issue_comment:
    types: [created]

env:
  ACTION_REVIEW_DISABLED: ${{ vars.ACTION_REVIEW_DISABLED }}

jobs:
  # S18 (audit I2): outcome capture on the accept path. Opening an accept/<date> PR with no
  # editorial feedback is the human's clean-accept action — stamp `outcome: accepted` on the
  # PR branch. The stamp only reaches main when the human merges (gate-0 stays human), so a
  # closed-unmerged PR never publishes a false verdict. A feedback-carrying PR takes the
  # revise job below instead, whose script stamps `outcome: edited`.
  stamp-accept:
    name: Stamp accepted outcome
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'opened' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'accept/') &&
      !contains(github.event.pull_request.body, 'EDITORIAL_FEEDBACK_START') &&
      !contains(github.event.pull_request.body, 'EDITORIAL_FEEDBACK_V2_START')
    concurrency:
      group: editorial-revise-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Extract article date from branch name
        id: date
        run: |
          # Read GITHUB_HEAD_REF from the environment, not an inline Actions expression:
          # the branch name is user-controlled, so validate its date suffix strictly.
          DATE="${GITHUB_HEAD_REF#accept/}"
          if [[ ! "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::accept/ branch suffix is not a YYYY-MM-DD date: $DATE"
            exit 1
          fi
          echo "article_path=_articles/${DATE}.md" >> "$GITHUB_OUTPUT"
          echo "📅 Article date: $DATE"

      - name: Require article and action data only before running PR code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ARTICLE_PATH: ${{ steps.date.outputs.article_path }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          ANCESTORS=$(git merge-base --all "$BASE_SHA" "$HEAD_SHA")
          if [[ "$ANCESTORS" == *$'\n'* || -z "$ANCESTORS" ]]; then
            echo "::error::A unique trusted common ancestor is required."
            exit 1
          fi
          CHANGED=$(git diff --no-renames --name-only "$ANCESTORS" "$HEAD_SHA")
          MODE=$(git ls-tree "$HEAD_SHA" -- "$ARTICLE_PATH" | cut -d ' ' -f 1)
          if [[ "$MODE" != '100644' || -z "$CHANGED" ]]; then
            echo "::error::Editorial article must be a regular file."
            exit 1
          fi
          while IFS= read -r FILE; do
            if [[ "$FILE" != "$ARTICLE_PATH" && "$FILE" != "actions/articles/$(basename "$ARTICLE_PATH" .md).json" ]]; then
              echo "::error::Editorial automation accepts only the dated article and canonical action data."
              exit 1
            fi
            if [[ "$(git ls-tree "$HEAD_SHA" -- "$FILE" | cut -d ' ' -f 1)" != '100644' ]]; then
              echo "::error::Editorial changes must be regular files."
              exit 1
            fi
          done <<< "$CHANGED"
          git worktree add --detach "$RUNNER_TEMP/editorial-policy" "$BASE_SHA"
          echo "POLICY_DIRECTORY=$RUNNER_TEMP/editorial-policy" >> "$GITHUB_ENV"
          git checkout -B "$HEAD_BRANCH" "$HEAD_SHA"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm --dir "$POLICY_DIRECTORY" install --frozen-lockfile

      - name: Validate registry changes within this article
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTICLE_PATH: ${{ steps.date.outputs.article_path }}
          ACTOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EDITORIAL_WORKSPACE: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --dir "$POLICY_DIRECTORY" exec tsx "$POLICY_DIRECTORY/scripts/check-editorial-actions.ts" "$BASE_SHA" "$HEAD_SHA" "$(basename "$ARTICLE_PATH" .md)" "$ACTOR" "$PR_NUMBER"

      - name: Stamp outcome on article frontmatter
        env:
          ARTICLE_PATH: ${{ steps.date.outputs.article_path }}
          OUTCOME: accepted
        run: ARTICLE_PATH="$GITHUB_WORKSPACE/$ARTICLE_PATH" pnpm --dir "$POLICY_DIRECTORY" exec tsx "$POLICY_DIRECTORY/src/stamp-outcome.ts"

      - name: Reconcile actions before clean acceptance
        env:
          ACTION_REVIEW_REQUEST: pull-request:${{ github.event.pull_request.number }}:clean-acceptance
          ARTICLE_PATH: ${{ steps.date.outputs.article_path }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: ARTICLE_PATH="$GITHUB_WORKSPACE/$ARTICLE_PATH" ACTION_REPO_ROOT="$GITHUB_WORKSPACE" pnpm --dir "$POLICY_DIRECTORY" exec tsx "$POLICY_DIRECTORY/scripts/reconcile-actions.ts"

      - name: Commit stamped article
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HEAD_BRANCH: ${{ github.head_ref }}
          ARTICLE_PATH: ${{ steps.date.outputs.article_path }}
        run: |
          git config user.name "ojfbot-blog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ARTICLE_PATH" "actions/articles/$(basename "$ARTICLE_PATH" .md).json"
          if git diff --cached --quiet; then
            echo "⏭ No outcome change to commit"
          else
            git commit -m "editorial: stamp outcome accepted"
            gh auth setup-git
            git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
          fi

      - name: Bind verified action output
        id: action_proof
        env:
          ARTICLE_PATH: ${{ steps.date.outputs.article_path }}
          INPUT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION_REPO_ROOT: ${{ github.workspace }}
        run: pnpm --dir "$POLICY_DIRECTORY" exec tsx "$POLICY_DIRECTORY/scripts/write-action-output.ts" clean-acceptance
      - uses: actions/upload-artifact@v4
        id: action_artifact
        with:
          name: ${{ steps.action_proof.outputs.artifact_name }}
          path: .git/editorial-output.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Record verified registry output
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.action_artifact.outputs.artifact-id }}
        with:
          script: |
            const receipt = JSON.parse(require('fs').readFileSync('.git/editorial-output.json', 'utf8'));
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: `## Verified action registry\n${JSON.stringify({ ...receipt, artifactId: Number(process.env.ARTIFACT_ID) })}` });


  revise:
    name: Apply editorial revisions
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'accept/') &&
      (contains(github.event.pull_request.body, 'EDITORIAL_FEEDBACK_START') ||
       contains(github.event.pull_request.body, 'EDITORIAL_FEEDBACK_V2_START'))
    concurrency:
      group: editorial-revise-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Guard — require an explicit editorial request
        id: guard
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          AUTHOR=$(git log -1 --format='%an' "$HEAD_SHA")
          SKIP=$(node .github/scripts/editorial-revision-admission.mjs "$AUTHOR")
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [[ "$SKIP" == 'true' ]]; then
            echo "⏭ Revision requires a non-bot account request with valid new feedback"
          fi

      - name: Extract article date from branch name
        if: steps.guard.outputs.skip != 'true'
        id: date
        run: |
          DATE="${GITHUB_HEAD_REF#accept/}"
          if [[ ! "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::accept/ branch suffix is not a YYYY-MM-DD date."
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "article_path=_articles/${DATE}.md" >> "$GITHUB_OUTPUT"
          echo "📅 Article date: $DATE"

      - name: Require article and action data only before running PR code
        if: steps.guard.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ARTICLE_PATH: ${{ steps.date.outputs.article_path }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          ANCESTORS=$(git merge-base --all "$BASE_SHA" "$HEAD_SHA")
          if [[ "$ANCESTORS" == *$'\n'* || -z "$ANCESTORS" ]]; then
            echo "::error::A unique trusted common ancestor is required."
            exit 1
          fi
          CHANGED=$(git diff --no-renames --name-only "$ANCESTORS" "$HEAD_SHA")
          MODE=$(git ls-tree "$HEAD_SHA" -- "$ARTICLE_PATH" | cut -d ' ' -f 1)
          if [[ "$MODE" != '100644' || -z "$CHANGED" ]]; then
            echo "::error::Editorial article must be a regular file."
            exit 1
          fi
          while IFS= read -r FILE; do
            if [[ "$FILE" != "$ARTICLE_PATH" && "$FILE" != "actions/articles/$(basename "$ARTICLE_PATH" .md).json" ]]; then
              echo "::error::Editorial automation accepts only the dated article and canonical action data."
              exit 1
            fi
            if [[ "$(git ls-tree "$HEAD_SHA" -- "$FILE" | cut -d ' ' -f 1)" != '100644' ]]; then
              echo "::error::Editorial changes must be regular files."
              exit 1
            fi
          done <<< "$CHANGED"
          git worktree add --detach "$RUNNER_TEMP/editorial-policy" "$BASE_SHA"
          echo "POLICY_DIRECTORY=$RUNNER_TEMP/editorial-policy" >> "$GITHUB_ENV"
          git checkout -B "$HEAD_BRANCH" "$HEAD_SHA"

      - name: Extract editorial feedback from PR body
        if: steps.guard.outputs.skip != 'true'
        id: feedback
        uses: actions/github-script@v7
        with:
          script: |
            const { extractEditorialFeedback } = await import(`${process.env.POLICY_DIRECTORY}/.github/scripts/extract-editorial-feedback.mjs`);
            const feedback = extractEditorialFeedback(context.payload.pull_request.body || '');
            core.setOutput('feedback', feedback);
            core.setOutput('request_digest', require('node:crypto').createHash('sha256').update(feedback).digest('hex'));
            core.info(`Extracted ${feedback.length} chars of feedback`);

      - name: Guard — feedback non-empty
        if: steps.guard.outputs.skip != 'true' && steps.feedback.outputs.feedback == ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '⚠️ Editorial feedback markers found but no actionable feedback extracted.\n\nPlease edit the PR body with non-empty editorial feedback. For v2 feedback, keep the encoded payload between its markers.',
            });
            core.setFailed('No feedback content between markers');

      - name: Setup pnpm
        if: steps.guard.outputs.skip != 'true' && steps.feedback.outputs.feedback != ''
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true' && steps.feedback.outputs.feedback != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true' && steps.feedback.outputs.feedback != ''
        run: pnpm --dir "$POLICY_DIRECTORY" install --frozen-lockfile

      - name: Validate registry changes within this article
        if: steps.guard.outputs.skip != 'true' && steps.feedback.outputs.feedback != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTICLE_PATH: ${{ steps.date.outputs.article_path }}
          ACTOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EDITORIAL_WORKSPACE: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --dir "$POLICY_DIRECTORY" exec tsx "$POLICY_DIRECTORY/scripts/check-editorial-actions.ts" "$BASE_SHA" "$HEAD_SHA" "$(basename "$ARTICLE_PATH" .md)" "$ACTOR" "$PR_NUMBER"

      - name: Run editorial revision
        if: steps.guard.outputs.skip != 'true' && steps.feedback.outputs.feedback != ''
        id: revise
        env:
          ACTION_REVIEW_REQUEST: pull-request:${{ github.event.pull_request.number }}:revision:${{ steps.feedback.outputs.request_digest }}
          ARTICLE_PATH: ${{ steps.date.outputs.article_path }}
          EDITORIAL_FEEDBACK: ${{ steps.feedback.outputs.feedback }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ARTICLE_PATH="$GITHUB_WORKSPACE/$ARTICLE_PATH" pnpm --dir "$POLICY_DIRECTORY" exec tsx "$POLICY_DIRECTORY/src/revise-article.ts" > /tmp/revision-result.json
          echo "changed=$(jq -r '.changed or .registryChanged' /tmp/revision-result.json)" >> "$GITHUB_OUTPUT"

      - name: Commit revised article
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HEAD_BRANCH: ${{ github.head_ref }}
        if: steps.guard.outputs.skip != 'true' && steps.revise.outputs.changed == 'true'
        run: |
          git config user.name "ojfbot-blog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.date.outputs.article_path }}" "actions/articles/$(basename "${{ steps.date.outputs.article_path }}" .md).json"
          git commit -m "editorial: revise ${{ steps.date.outputs.date }} per feedback"
          gh auth setup-git
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"

      - name: Bind verified action output
        id: action_proof
        if: steps.guard.outputs.skip != 'true' && steps.feedback.outputs.feedback != ''
        env:
          ARTICLE_PATH: ${{ steps.date.outputs.article_path }}
          INPUT_HEAD: ${{ github.event.pull_request.head.sha }}
          REQUEST_DIGEST: ${{ steps.feedback.outputs.request_digest }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION_REPO_ROOT: ${{ github.workspace }}
        run: pnpm --dir "$POLICY_DIRECTORY" exec tsx "$POLICY_DIRECTORY/scripts/write-action-output.ts" revision
      - uses: actions/upload-artifact@v4
        id: action_artifact
        if: steps.guard.outputs.skip != 'true' && steps.feedback.outputs.feedback != ''
        with:
          name: ${{ steps.action_proof.outputs.artifact_name }}
          path: .git/editorial-output.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Record verified registry output
        if: steps.guard.outputs.skip != 'true' && steps.feedback.outputs.feedback != ''
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.action_artifact.outputs.artifact-id }}
        with:
          script: |
            const receipt = JSON.parse(require('fs').readFileSync('.git/editorial-output.json', 'utf8'));
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: `## Verified action registry\n${JSON.stringify({ ...receipt, artifactId: Number(process.env.ARTIFACT_ID) })}` });
      - name: Post revision summary on PR
        if: steps.guard.outputs.skip != 'true' && steps.feedback.outputs.feedback != ''
        uses: actions/github-script@v7
        env:
          FEEDBACK: ${{ steps.feedback.outputs.feedback }}
        with:
          script: |
            const fs = require('fs');
            let result;
            try {
              result = JSON.parse(fs.readFileSync('/tmp/revision-result.json', 'utf-8'));
            } catch {
              return; // revision step failed, no result to post
            }

            const changes = (result.changesSummary || [])
              .map(c => `- ${c}`)
              .join('\n');

            const status = result.changed || result.registryChanged
              ? '✅ **Revision applied** — changes committed to this branch.'
              : 'ℹ️ **No changes needed** — the article already reflects the feedback.';

            const sha = result.changed
              ? `\nCommit: \`${process.env.GITHUB_SHA?.slice(0, 7) ?? 'pending'}\``
              : '';

            const feedback = process.env.FEEDBACK || '';

            const body = [
              '## Editorial Revision',
              '',
              status,
              '',
              '### Changes',
              '',
              changes || '- No changes applied',
              '',
              '<details><summary>Details</summary>',
              '',
              '**Request for revision:**',
              '',
              '```',
              feedback,
              '```',
              '',
              `Model: \`claude-sonnet-4-6\`${sha}`,
              `Feedback items: ${(result.changesSummary || []).length}`,
              '',
              '</details>',
            ].join('\n');

            // Update existing bot comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body?.includes('## Editorial Revision') &&
              c.user?.login === 'github-actions[bot]'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  admit-continuation:
    if: >-
      github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.repository == 'ojfbot/daily-logger' && github.event.issue.pull_request &&
      github.event.sender.login == 'ojfbot' && github.event.comment.user.login == 'ojfbot' &&
      startsWith(github.event.comment.body, '## Explicit editorial revision request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    outputs:
      pull_request: ${{ steps.admit.outputs.pull_request }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: admit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec tsx .github/scripts/continue-editorial.ts admit

  continue-editorial:
    needs: admit-continuation
    concurrency:
      group: editorial-revise-${{ needs.admit-continuation.outputs.pull_request }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Claim request and prepare revision from trusted code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm exec tsx .github/scripts/continue-editorial.ts prepare
      - name: Push validated article and record outcome
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh auth setup-git
          pnpm exec tsx .github/scripts/continue-editorial.ts push

      - name: Bind continued action output
        id: continued_proof
        run: pnpm exec tsx scripts/write-action-output.ts continuation
      - uses: actions/upload-artifact@v4
        id: continued_artifact
        if: steps.continued_proof.outputs.artifact_name != ''
        with:
          name: ${{ steps.continued_proof.outputs.artifact_name }}
          path: .git/editorial-output.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Record artifact-bound continuation outcome
        if: steps.continued_artifact.outputs.artifact-id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDITORIAL_ARTIFACT_ID: ${{ steps.continued_artifact.outputs.artifact-id }}
        run: pnpm exec tsx .github/scripts/continue-editorial.ts finalize

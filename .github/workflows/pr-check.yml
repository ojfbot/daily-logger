name: PR Check

# Validates every PR to main:
#   1. Unit tests
#   2. Pipeline smoke test (MOCK_LLM=true — no Anthropic API call, no GH_PAT required)
#   3. PR body builder script
#
# The smoke test exercises the full generate → council → synthesize → write path
# using a fixture StructuredArticle instead of a real LLM response. This catches
# structural regressions (tool_use parsing, assembleBody, toMarkdown) without
# burning API credits or requiring secrets.

on:
  pull_request:
    branches: [main]

jobs:
  browser:
    name: Editorial browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  check:
    name: Test + pipeline smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Verify acceptance registry against trusted policy
        if: startsWith(github.head_ref, 'accept/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDITORIAL_WORKSPACE: ${{ github.workspace }}
        run: |
          DATE="${HEAD_BRANCH#accept/}"
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          POLICY_DIRECTORY="$RUNNER_TEMP/editorial-admission-policy"
          git worktree add --detach "$POLICY_DIRECTORY" "$BASE_SHA"
          pnpm --dir "$POLICY_DIRECTORY" install --frozen-lockfile
          # A bot push starts checks just before its output receipt is appended.
          # Wait only for that read-only proof; never invoke or replay a model here.
          for ATTEMPT in 1 2 3 4 5 6; do
            if pnpm --dir "$POLICY_DIRECTORY" exec tsx "$POLICY_DIRECTORY/scripts/check-editorial-actions.ts" "$BASE_SHA" "$HEAD_SHA" "$DATE" "$ACTOR" "$PR_NUMBER"; then
              exit 0
            fi
            if [[ "$ATTEMPT" == 6 ]]; then exit 1; fi
            sleep 5
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Receipt-free action prompt budget
        run: pnpm check:action-size

      - name: Scheduled fallback tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_daily_blog_schedule.py' -v

      - name: Editorial PR boundary tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_editorial_pr_boundary.py' -v

      - name: Editorial feedback extraction tests
        run: node --test .github/scripts/test_extract_editorial_feedback.mjs .github/scripts/test_editorial_revision_admission.mjs

      - name: Unit tests
        run: pnpm test

      # Golden eval suite (audit S19 / I4). ADVISORY ONLY — continue-on-error
      # guarantees it never blocks a PR; it posts the pass/fail diff vs the
      # committed snapshot (evals/results/latest.json) to the job summary.
      # Promotion to a blocking gate is a later data-gated RIDM decision
      # (S16 shadow→enforce pattern) — do not flip this without one.
      # Runs BEFORE the smoke test: the smoke test writes a mock article into
      # _articles/, which the corpus-scanning tasks must not see.
      - name: Golden eval suite (advisory — never blocks)
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm eval 2>&1 | tee /tmp/eval-output.txt

      - name: Eval diff → job summary (advisory)
        if: always()
        continue-on-error: true
        run: |
          {
            echo '## Golden eval suite — advisory (audit S19 / I4)'
            echo ''
            echo 'Never blocks. Diff is against the committed snapshot `evals/results/latest.json`.'
            echo ''
            echo '```text'
            sed -n '/── eval summary ──/,$p' /tmp/eval-output.txt 2>/dev/null \
              || echo '(no eval output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pipeline smoke test (mock LLM — no API call)
        env:
          # MOCK_LLM=true: generateArticle() and council calls return fixtures.
          # The Anthropic SDK constructor requires a key string but never calls
          # the API in mock mode — this placeholder satisfies the env check.
          ANTHROPIC_API_KEY: sk-ant-mock-smoke-test
          # GITHUB_TOKEN has read access to public repos for the collect phase.
          # Private repos return empty arrays (ghApi silently skips 404s).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OJFBOT_ORG: ojfbot
          MOCK_LLM: "true"
          # Fixed date so the output file is predictable for the PR body check below.
          DATE_OVERRIDE: "2026-01-01"
          DRY_RUN: "false"
          # This synthetic run must exercise the complete write path even when
          # the fixed historical window has no meaningful repository activity.
          FORCE_RUN: "true"
          # Pin the sweep to this repo. Membership is derived from `gh repo list`
          # in real runs (src/fleet.ts), but with the fixed 2026-01-01 anchor every
          # PR in the org counts as "recent" and the per-PR skill-comment scrape
          # fans out to hundreds of gh calls — it blew the 5-minute job budget
          # once the busy repos' PR lists started parsing (2026-09-24).
          FLEET_REPOS: daily-logger
        run: pnpm generate

      - name: Verify article was written
        run: |
          if [ ! -f "_articles/2026-01-01.md" ]; then
            echo "❌ _articles/2026-01-01.md was not created by the smoke test"
            exit 1
          fi
          echo "✓ Article file exists"
          # Verify the three authored prose sections are present.
          for section in "## What shipped" "## The decisions" "## Roadmap pulse"; do
            if ! grep -q "${section}" _articles/2026-01-01.md; then
              echo "❌ Missing section: ${section}"
              exit 1
            fi
          done
          # The maintained card is the only current recommendation surface.
          if [ "$(grep -c '>Suggested actions</h3>' _articles/2026-01-01.md)" -ne 1 ]; then
            echo "❌ Expected exactly one maintained Suggested actions card"
            exit 1
          fi
          if grep -Eq "^## (What['’]s next|Next actions|Suggested actions)[[:space:]]*$|Choose a supported next step" _articles/2026-01-01.md; then
            echo "❌ Found a competing legacy recommendation surface"
            exit 1
          fi
          if ! grep -q '<summary>Earlier draft notes</summary>' _articles/2026-01-01.md; then
            echo "❌ Preserved draft context is missing from its closed history disclosure"
            exit 1
          fi
          node -e "const fs=require('fs'); const file=JSON.parse(fs.readFileSync('actions/articles/2026-01-01.json','utf8')); const snapshot=file.snapshot; if(snapshot.draftContext?.kind!=='retained'||!snapshot.draftContext.markdown.includes('Merge the PR if the smoke test passes.')||!/^[a-f0-9]{64}$/.test(snapshot.stateDigest)) throw new Error('Draft context is not preserved and bound into action-review state');"
          echo "✓ Authored sections, single maintained card, and bound draft context present"

      - name: Build and verify static JSON API
        run: |
          pnpm check:action-intake
          pnpm build:api
          for f in api/entries.json api/actions.json api/tags.json api/repos.json; do
            if [ ! -f "$f" ]; then
              echo "❌ $f was not created"
              exit 1
            fi
            # Validate JSON syntax
            node -e "JSON.parse(require('fs').readFileSync('$f','utf-8'))"
            echo "✓ $f is valid JSON"
          done

      - name: PR body builder check
        run: |
          python3 .github/scripts/build_pr_body.py \
            "2026-01-01" "article/2026-01-01" "_articles/2026-01-01.md" \
            > /tmp/pr-body.md
          # Verify the output contains expected structural elements
          if ! grep -q "Daily article" /tmp/pr-body.md; then
            echo "❌ PR body builder output missing expected content"
            cat /tmp/pr-body.md
            exit 1
          fi
          echo "✓ PR body builder produced valid output"
          echo "--- PR body preview ---"
          head -20 /tmp/pr-body.md
